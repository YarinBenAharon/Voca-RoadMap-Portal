<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request a Feature · Voca CIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/public/public.css">

<body>

<!-- The feature request portal, opened by Request a Feature on the board.
     Under construction for now: the same page /public shows while blocked
     (its top bar and .uc styles come from public.css). -->
<div class="topbar">
  <div class="wrap">
    <span class="logo brand">
      <picture><source srcset="/shared/brand/static/voca-mixed.png" media="(prefers-reduced-motion: reduce)"><img src="/shared/brand/webp/voca-mixed.webp" alt="Voca" width="112" height="30"></picture>
      <span class="brand-sep"></span>
      <picture><source srcset="/shared/brand/static/audiocodes-white.png" media="(prefers-reduced-motion: reduce)"><img src="/shared/brand/webp/audiocodes-white.webp" alt="AudioCodes" width="173" height="24"></picture>
    </span>
  </div>
</div>
<main class="uc">
  <picture>
    <source srcset="/shared/brand/static/voca-color.png" media="(prefers-reduced-motion: reduce)">
    <img src="/shared/brand/webp/voca-loader.webp" alt="Voca" width="200" height="53">
  </picture>
  <h1>Feature requests are coming soon</h1>
  <p>We're building a place to submit and follow feature requests for Voca CIC. Please check back soon.</p>
  <div class="uc-bar" aria-hidden="true"></div>
  <p class="uc-contact">Have a request now? Contact Voca Product Management.</p>
  <a class="uc-back" href="/">← Back to the roadmap</a>
</main>
